# CI: typecheck and the test suite on linux-x64 and macOS arm64. On macOS the single executable is
# also built and proven on a clean machine (always, so a test failure still shows whether it builds).
# The scrub test's private term list is not available here by design (MW_SCRUB_TERMS is unset); its
# generic patterns still run. Actions are pinned by major tag; node is pinned to 24.21.0.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --test --test-reporter=dot 'test/**/*.test.ts'
        env:
          MW_DELEGATE_ALLOW_MOCK: "1"
      - if: always() && runner.os == 'macOS'
        run: scripts/build-binary.sh
      - if: always() && runner.os == 'macOS'
        run: scripts/clean-machine-test.sh build/mw-darwin-arm64
