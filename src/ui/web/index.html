<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>MergeWright</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <h1 class="brand">
      <svg class="mark" viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" focusable="false"><path d="M3 2v12M13 2v5a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="13" cy="12" r="2" fill="currentColor"/></svg>
      MergeWright
    </h1>
    <nav aria-label="Views">
      <ul>
        <li><a href="#/board" data-view="board">Board</a></li>
        <li><a href="#/specs" data-view="specs">Specs</a></li>
        <li><a href="#/search" data-view="search">Search</a></li>
        <li><a href="#/settings" data-view="settings">Packages and settings</a></li>
      </ul>
    </nav>
  </header>
  <main id="main" tabindex="-1" aria-busy="true"><p class="muted">Loading…</p></main>
  <footer class="status" aria-label="Status">
    <p class="status-line" role="status" aria-live="polite">
      <span>Project <strong id="project-name">…</strong></span>
      <span id="stream-state" data-state="off">Live updates connecting</span>
    </p>
    <ul id="messages" class="messages" aria-live="polite" aria-relevant="additions"></ul>
  </footer>
</body>
</html>
