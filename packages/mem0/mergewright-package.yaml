name: mem0
version: 0.1.0
description: Lessons and decisions in a self-hosted mem0 server, searched for the prompt's recall and for mw memory search.
apiVersion: 1
entry: index.mjs
exports: [recall, search, remember, tools, checks]
secrets:
  - { config: key_env, default: MEM0_API_KEY }
config:
  type: object
  additionalProperties: false
  required: [url]
  properties:
    url:
      type: string
      description: The mem0 server, e.g. http://192.0.2.10:8888
    user:
      type: string
      description: The namespace (mem0 user_id); default the project's name
    key_env:
      type: string
      pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      description: The environment variable that holds the API key (sent as X-API-Key); default MEM0_API_KEY
    write_timeout_ms:
      type: integer
      minimum: 1
      description: Timeout of one write (POST /memories) in milliseconds (default 180000); reads keep 10000
